version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # Major upgrades are done by hand, one at a time.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
