name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
# Deploys write to production (database migrations, station seed, Worker). Read-only token, one deploy at a time, in order.
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ github.event.workflow_run.head_sha }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @noir/web
        env:
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN_WEB }}
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      - run: npm run migrate -w @noir/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
      # Idempotent upsert of the demo stations (docs/adr/0014): new stations appear on deploy, existing rows are re-written with the same values.
      - run: npm run seed -w @noir/engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
      - run: npx wrangler deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
