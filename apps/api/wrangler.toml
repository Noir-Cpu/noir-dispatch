name = "noir-dispatch-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Static web build is served from the same Worker (Workers static assets, not Pages).
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Plain (non-secret) settings. Secrets stay in `wrangler secret put` (docs/SETUP.md).
[vars]
# Straight-line km from the chosen station within which orders are accepted (ADR 0014). Anything unusable falls back to 12.
DELIVERY_RADIUS_KM = "12"
# Global cap on "Run demo" steps per UTC day. This is what bounds Neon compute spent on demos (ADR 0016). About 40 steps per typical run (measured: 39 for a 6 km trip).
DEMO_DAILY_STEP_CAP = "400"
# Demo steps one client address may take per UTC day (hashed, stored in demo_usage). A full run is 39 to 58 steps, so 120 is two or three runs. The global cap above stays as the backstop.
DEMO_IP_DAILY_STEPS = "120"

[observability]
enabled = true

# One Durable Object per active delivery. SQLite-backed, which the Workers Free plan allows.
[[durable_objects.bindings]]
name = "TRACKING"
class_name = "TrackingRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TrackingRoom"]

# Safety-net dispatch and sweep, hourly (dispatch also runs inline on every order and driver event). A per-minute cron
# kept Neon compute awake 24/7, which would use the free 100 CU-hours in about 17 days. Uses 1 of the 5 cron triggers.
[triggers]
crons = ["0 * * * *"]

# Per-client rate limit for every request that declares a role (see apps/api/src/app.ts `limited`).
[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 60
  period = 60
