name = "noir-dispatch-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Static web build is served from the same Worker (Workers static assets, not Pages).
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

# One Durable Object per active delivery. SQLite-backed, which the Workers Free plan allows.
[[durable_objects.bindings]]
name = "TRACKING"
class_name = "TrackingRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TrackingRoom"]

# Dispatch tick. Uses 1 of the 5 cron triggers on the account.
[triggers]
crons = ["* * * * *"]
